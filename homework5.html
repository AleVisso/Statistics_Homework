<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Deliverable — Welford Recurrence & Statistical Sampling Inference</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        warm: {
                            bg: '#fcf8f2',
                            card: '#ffffff',
                            border: '#e7d7c1',
                            accent: '#b45309',
                            terracotta: '#c2410c',
                            amber: '#d97706',
                            muted: '#78716c'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body {
            background-color: #fcf8f2;
            color: #292524;
        }
        .warm-glow {
            box-shadow: 0 10px 30px rgba(180, 83, 9, 0.08);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fcf8f2; }
        ::-webkit-scrollbar-thumb { background: #d7ccc8; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #bcaaa4; }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans selection:bg-amber-500 selection:text-white">

    <header class="border-b border-amber-200 bg-white/90 backdrop-blur-xl sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
            </div>
            
            <nav class="flex flex-wrap justify-center gap-1.5 bg-amber-100/70 p-1.5 rounded-2xl border border-amber-200">
                <button onclick="switchTab('section1')" id="btn-section1" class="tab-btn px-4 py-2 text-xs font-semibold rounded-xl transition-all duration-300 bg-amber-600 text-white shadow-md">
                </button>
                <button onclick="switchTab('section2')" id="btn-section2" class="tab-btn px-4 py-2 text-xs font-semibold rounded-xl transition-all duration-300 text-stone-700 hover:text-amber-900 hover:bg-amber-200/50">
                </button>
                <button onclick="switchTab('section3')" id="btn-section3" class="tab-btn px-4 py-2 text-xs font-semibold rounded-xl transition-all duration-300 text-stone-700 hover:text-amber-900 hover:bg-amber-200/50">
                </button>
            </nav>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">

        <!-- SECTION 1: WELFORD'S ALGORITHM -->
        <section id="section1" class="tab-content space-y-8">
            <div class="bg-white border border-amber-200 rounded-3xl p-6 sm:p-8 warm-glow shadow-sm max-w-5xl mx-auto space-y-6">
                <div class="space-y-4 text-stone-700 text-xs sm:text-sm leading-relaxed">
                    <div class="p-5 bg-amber-50/60 border border-amber-200 rounded-2xl space-y-3">
                    </div>

                    <div class="p-5 bg-amber-50/60 border border-amber-200 rounded-2xl space-y-3">
                    </div>

                    <div class="space-y-2">
                        <div class="bg-stone-900 text-amber-200 p-4 rounded-2xl font-mono text-xs overflow-x-auto shadow-inner">
                        </div>
                    </div>

                    <div class="p-5 bg-amber-50/40 border border-amber-200 rounded-2xl space-y-4">
                        <div class="flex flex-col sm:flex-row gap-3 items-center">
                            <button onclick="runWelfordDemo()" class="px-6 py-2.5 rounded-xl bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs shadow-md transition-all whitespace-nowrap">
                            </button>
                        </div>
                        <div id="welfordResult" class="text-xs font-mono bg-white p-4 rounded-xl border border-amber-200 space-y-1">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 2: HACKER SAMPLING SIMULATION -->
        <section id="section2" class="tab-content hidden space-y-8">
            <div class="bg-white border border-amber-200 rounded-3xl p-6 sm:p-8 warm-glow shadow-sm max-w-5xl mx-auto space-y-6">
                <h3 class="text-xl font-bold text-amber-900 text-center">
                </h3>
                
                <p class="text-xs sm:text-sm text-stone-600 leading-relaxed text-center">
                </p>

                <div class="bg-amber-50/60 border border-amber-200 p-6 rounded-2xl space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div class="space-y-1.5">
                            <input type="number" id="simM" value="1000" min="10" max="10000" class="w-full p-2 text-xs text-stone-800 bg-white border border-amber-300 rounded-xl focus:outline-none focus:border-amber-500">
                        </div>
                        <div class="space-y-1.5">
                            <input type="number" id="simN" value="50" min="2" max="2000" class="w-full p-2 text-xs text-stone-800 bg-white border border-amber-300 rounded-xl focus:outline-none focus:border-amber-500">
                        </div>
                    </div>

                    <div class="flex justify-center pt-2">
                        <button onclick="runHackerSimulation()" class="px-8 py-2.5 rounded-xl bg-gradient-to-r from-amber-600 to-terracotta-600 hover:from-amber-500 hover:to-terracotta-500 text-white font-bold text-xs shadow-md transition-all">
                        </button>
                    </div>
                </div>

                <div id="simResultsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 text-center hidden">
                    <div class="p-4 bg-amber-50/40 border border-amber-200 rounded-2xl">
                    </div>
                    <div class="p-4 bg-amber-50/40 border border-amber-200 rounded-2xl">
                    </div>
                    <div class="p-4 bg-amber-50/40 border border-amber-200 rounded-2xl">
                    </div>
                    <div class="p-4 bg-amber-50/40 border border-amber-200 rounded-2xl">
                    </div>
                </div>
            </div>
        </section>

        <!-- SECTION 3: INFERENTIAL ANALYSIS -->
        <section id="section3" class="tab-content hidden space-y-8">
            <div class="bg-white border border-amber-200 rounded-3xl p-6 sm:p-8 warm-glow shadow-sm max-w-5xl mx-auto space-y-6">
                <h3 class="text-xl font-bold text-amber-900 text-center">
                </h3>
                
                <div class="space-y-4 text-stone-700 text-xs sm:text-sm leading-relaxed">
                    <div class="p-5 bg-amber-50/50 border border-amber-200 rounded-2xl space-y-2">
                        <p>
                        </p>
                    </div>

                    <div class="p-5 bg-amber-50/50 border border-amber-200 rounded-2xl space-y-2">
                        <ul class="list-disc list-inside space-y-1 pl-2">
                        </ul>
                    </div>

                    <div class="p-5 bg-amber-50/50 border border-amber-200 rounded-2xl space-y-2">
                        <p>
                        </p>
                    </div>
                </div>
            </div>
        </section>

    </main>
</body>
</html>
